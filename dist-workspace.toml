# cargo-dist configuration, kept ready for when this repository goes public.
#
# While the repository is private, releases come from .github/workflows/release.yml
# and are installed with install.sh / install.ps1 through the player's own `gh`
# login. Nothing here runs today: there is no dist-generated workflow, and the
# public installers (shell, powershell, homebrew) are switched off. To go
# public, pick the installers, run `dist init`, and let it regenerate CI.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.2"
# No public installers while private. When public, for example:
# installers = ["shell", "powershell", "homebrew"]
installers = []
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# No dist-generated CI yet; release.yml does the work.
ci = []
install-path = "~/.local/bin"
