# cargo-dist configuration, kept but not used.
#
# Releases come from .github/workflows/release.yml as public GitHub Releases,
# installed with install.sh / install.ps1 (through `gh` when it is signed in,
# plain HTTPS otherwise). Nothing here runs: there is no dist-generated
# workflow, and the cargo-dist installers (shell, powershell, homebrew) are
# switched off.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.2"
# Off: install.sh and install.ps1 are the installers.
installers = []
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# No dist-generated CI yet; release.yml does the work.
ci = []
install-path = "~/.local/bin"
