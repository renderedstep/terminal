[workspace]
members = [".", "crates/engine-core"]
resolver = "2"

[package]
name = "text-adventure-terminal"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal client for the text-adventure engine protocol v1"
repository = "https://github.com/renderedstep/terminal"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ta"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1"
jsonschema = { version = "0.33", default-features = false }

[profile.release]
lto = "thin"
strip = true

# The profile cargo-dist builds with.
[profile.dist]
inherits = "release"

# `publish = false` keeps it off crates.io; this keeps cargo-dist building it.
[package.metadata.dist]
dist = true
